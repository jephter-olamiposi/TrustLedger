[workspace]
resolver = "2"
members = [
    "crates/ledger-core",
    "crates/wal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jephter-olamiposi/TrustLedger"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# Pinned: 1.9+ raises MSRV to 1.82+ and breaks the MSRV 1.80 gate (ADR-0008);
# the lockfile pins 1.8.0.
proptest = "1"
crc32c = "0.6.8"
# default-features off: the default `heapless-cas` feature pulls the
# unmaintained atomic-polyfill (RUSTSEC-2023-0089) into the money path for no
# benefit here (we only serialize Vec<LedgerEvent>), ADR-0008.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tempfile = "3"
# Pinned: 0.8+ raises MSRV to 1.86 and breaks the MSRV 1.80 gate (ADR-0008).
criterion = { version = "=0.7.0" }
fs4 = "0.12"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
