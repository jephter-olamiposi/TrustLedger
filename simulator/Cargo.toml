[package]
name = "simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FoundationDB/TigerBeetle-style Deterministic Simulation Testing (DST) harness for TrustLedger"

[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
ledger-core = { path = "../crates/ledger-core", version = "0.1" }
wal = { path = "../crates/wal", version = "0.1" }
observability = { path = "../crates/observability", version = "0.1" }
rand = "0.8"
rand_chacha = "0.9"
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
