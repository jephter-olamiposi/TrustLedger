# Supply-chain gate (ADR-0008). Enforced in CI by
# EmbarkStudios/cargo-deny-action@v2 (`cargo deny check`).
#
# cargo-deny v2 defaults: every advisory severity is deny, and every license
# not explicitly allowed is deny. Keep this file honest: an allow-list entry
# here is a deliberate, reviewed position, not a lint to silence.

[advisories]
# All severities (vulnerability, unmaintained, unsound, notice) deny by
# default in v2. `ignore` is reserved for a reviewed, time-boxed deviation and
# must carry a reason.

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    { name = "windows-sys", reason = "transitive windows-only surface split across 0.52/0.59" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# An allow entry is a single SPDX id (optionally with `WITH <exception>`),
# not a compound expression: cargo-deny satisfies each crate's OR/AND
# expression against this flat set.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
]

# r-efi is optional EFI/embedded glue pulled in by rustix only for UEFI targets.
# It does not appear in the default (macOS/Linux host) resolution graph; if you
# cross-build for UEFI, add an exception here:  { name = "r-efi", allow = ["MIT"] }
# The MIT branch of its `MIT OR Apache-2.0 OR LGPL-2.1-or-later` expression is
# exercised; the LGPL term is never selected on the supported surface.